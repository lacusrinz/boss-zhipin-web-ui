{% extends "base.html" %}

{% block title %}错误 - BOSS 直聘管理{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8 text-center">
        <div class="text-gray-400 text-6xl mb-4">⚠️</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-4">出错了</h1>
        <p class="text-gray-600 mb-6">{{ message or '服务器发生错误' }}</p>
        <a href="{{ url_for('index') }}" class="inline-block px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            返回首页
        </a>
    </div>
</div>
{% endblock %}
