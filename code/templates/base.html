<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BOSS 直聘管理{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-blue-600 shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-1">
                    <a href="{{ url_for('index') }}" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-white hover:bg-blue-700 {% if request.endpoint == 'index' %}bg-blue-800{% endif %}">
                        🔗 粘贴数据
                    </a>
                    <a href="{{ url_for('jobs_list') }}" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-white hover:bg-blue-700 {% if request.endpoint == 'jobs_list' %}bg-blue-800{% endif %}">
                        📋 岗位明细
                    </a>
                    <a href="{{ url_for('companies_list') }}" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-white hover:bg-blue-700 {% if request.endpoint == 'companies_list' %}bg-blue-800{% endif %}">
                        🏢 企业清单
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Flash 消息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="max-w-7xl mx-auto px-4 mt-4">
                {% for category, message in messages %}
                    <div class="p-4 rounded-md mb-2 {% if category == 'error' %}bg-red-100 text-red-700 border border-red-300{% elif category == 'success' %}bg-green-100 text-green-700 border border-green-300{% else %}bg-blue-100 text-blue-700 border border-blue-300{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t mt-8 py-4">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm">
            BOSS 直聘管理界面 - 本地运行
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
